<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>

  <text x="30" y="42" font-size="26" font-weight="700" fill="#0f172a">System sketch: where Ẹ̀rí fits in the Nigerian election chain</text>
  <text x="30" y="68" font-size="14" fill="#475569">Every Vote, Every Voice · one weak link: what happens to a result after it leaves the polling unit</text>

  <!-- THE CHAIN -->
  <text x="30" y="104" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">THE ELECTION CHAIN</text>

  <g font-size="13" text-anchor="middle">
    <rect x="30"  y="116" width="150" height="74" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="105" y="146" font-weight="700" fill="#334155">Inform &amp; register</text>
    <text x="105" y="168" fill="#64748b">voters, PVCs, PU finder</text>

    <rect x="197" y="116" width="150" height="74" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="272" y="146" font-weight="700" fill="#334155">Accredit &amp; vote</text>
    <text x="272" y="168" fill="#64748b">polling unit, BVAS</text>

    <rect x="364" y="116" width="150" height="74" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="439" y="146" font-weight="700" fill="#0f172a">Count &amp; sign</text>
    <text x="439" y="168" fill="#134e4a">EC8A at the PU</text>

    <rect x="531" y="116" width="150" height="74" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="606" y="146" font-weight="700" fill="#0f172a">Ward collation</text>
    <text x="606" y="168" fill="#134e4a">EC8B</text>

    <rect x="698" y="116" width="150" height="74" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="773" y="146" font-weight="700" fill="#0f172a">LGA collation</text>
    <text x="773" y="168" fill="#134e4a">EC8C</text>

    <rect x="865" y="116" width="150" height="74" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="940" y="146" font-weight="700" fill="#0f172a">State collation</text>
    <text x="940" y="168" fill="#134e4a">EC8D</text>

    <rect x="1032" y="116" width="138" height="74" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="1101" y="146" font-weight="700" fill="#334155">Declaration</text>
    <text x="1101" y="168" fill="#64748b">EC8E, disputes</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)">
    <line x1="182" y1="153" x2="195" y2="153"/><line x1="349" y1="153" x2="362" y2="153"/><line x1="516" y1="153" x2="529" y2="153"/>
    <line x1="683" y1="153" x2="696" y2="153"/><line x1="850" y1="153" x2="863" y2="153"/><line x1="1017" y1="153" x2="1030" y2="153"/>
  </g>

  <!-- bracket -->
  <path d="M364,204 L364,214 L1015,214 L1015,204" fill="none" stroke="#0f766e" stroke-width="2"/>
  <text x="690" y="236" font-size="14" font-weight="700" text-anchor="middle" fill="#0f766e">THE LINK WE CHOSE: from the polling-unit sheet (EC8A) up to the declaration. Is what was announced what was counted?</text>

  <!-- INPUTS -->
  <text x="30" y="282" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">WHO FEEDS Ẹ̀rí</text>
  <g font-size="13">
    <rect x="30" y="296" width="290" height="132" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
    <text x="46" y="322" font-weight="700" fill="#0f172a">Witnesses at the polling unit</text>
    <text x="46" y="344" fill="#334155">Citizens, party agents, observers</text>
    <text x="46" y="368" fill="#334155">• Photo of the EC8A (WhatsApp / web)</text>
    <text x="46" y="388" fill="#334155">• SMS on a basic phone (2G): R 017 A159…</text>
    <text x="46" y="408" fill="#334155">• Web form · USSD check *347*PU#</text>

    <rect x="30" y="444" width="290" height="104" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
    <text x="46" y="470" font-weight="700" fill="#0f172a">Collation centre (EC8B to EC8D)</text>
    <text x="46" y="492" fill="#334155">Officers read figures aloud. An observer</text>
    <text x="46" y="512" fill="#334155">plays or records it; Live Ear turns the</text>
    <text x="46" y="532" fill="#334155">audio into figures per ward / LGA.</text>
  </g>

  <!-- ENGINE -->
  <text x="400" y="282" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">THE ENGINE</text>
  <rect x="400" y="296" width="400" height="252" rx="14" fill="#0f172a"/>
  <g font-size="13" fill="#e2e8f0">
    <text x="420" y="326" font-size="18" font-weight="700" fill="#5eead4">Ẹ̀rí (Yorùbá: witness, proof)</text>
    <text x="420" y="356" font-weight="700" fill="#ffffff">Reads the evidence</text>
    <text x="420" y="376">AI reads EC8A photos and spoken figures</text>
    <text x="420" y="396">(five languages; offline fallback)</text>
    <text x="420" y="426" font-weight="700" fill="#ffffff">Proof Tree: hop-by-hop reconciliation</text>
    <text x="420" y="446">PU consensus of witnesses → ward → LGA → state</text>
    <text x="420" y="466">A hop is Traced, Partly proven, Contested or</text>
    <text x="420" y="486">Flagged (announced is more than witnessed)</text>
    <text x="420" y="516" fill="#94a3b8">PostgreSQL · audit log · role-based access</text>
  </g>

  <!-- OUTPUTS -->
  <text x="880" y="282" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">WHO IT PROTECTS</text>
  <g font-size="13">
    <rect x="880" y="296" width="290" height="78" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="896" y="322" font-weight="700" fill="#9a3412">Witness Alarm (SMS + voice call)</text>
    <text x="896" y="344" fill="#7c2d12">Told in English, Pidgin, Hausa, Yorùbá</text>
    <text x="896" y="362" fill="#7c2d12">or Igbo when their PU's numbers change.</text>

    <rect x="880" y="388" width="290" height="78" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="896" y="414" font-weight="700" fill="#155e75">Public Trust Desk + Results trail</text>
    <text x="896" y="436" fill="#164e63">Trace a PU by code, check a forwarded</text>
    <text x="896" y="454" fill="#164e63">image, report a concern. Always unofficial.</text>

    <rect x="880" y="480" width="290" height="68" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="896" y="506" font-weight="700" fill="#5b21b6">Tribunal evidence pack (PDF)</text>
    <text x="896" y="528" fill="#4c1d95">Figures, witnesses, photos, timeline.</text>
  </g>

  <g stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr)">
    <line x1="322" y1="362" x2="398" y2="362"/>
    <line x1="322" y1="496" x2="398" y2="440"/>
    <line x1="802" y1="335" x2="878" y2="335"/>
    <line x1="802" y1="427" x2="878" y2="427"/>
    <line x1="802" y1="514" x2="878" y2="514"/>
  </g>

  <!-- ROADMAP -->
  <rect x="30" y="580" width="1140" height="86" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 5"/>
  <text x="48" y="608" font-size="13" font-weight="700" fill="#334155">How it connects to the wider system (roadmap, not built)</text>
  <text x="48" y="632" font-size="13" fill="#475569">Pull IReV result images and E Don Kast crowdsourced sheets in as extra witnesses · partner with observer groups and party agents for coverage</text>
  <text x="48" y="652" font-size="13" fill="#475569">Real SMS, USSD and voice gateways (Africa's Talking) · offline phone-to-phone sync for poor networks · national level (EC8D(A), EC8E)</text>

  <text x="30" y="700" font-size="12" fill="#64748b">Complements INEC (IReV) and citizen platforms; it does not declare or predict results. Names and places are real, every vote figure in the prototype is fictional sample data.</text>
  <text x="30" y="722" font-size="12" fill="#64748b">Live demo: https://eri-hackathon.netlify.app</text>
</svg>
